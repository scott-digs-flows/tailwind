cubes:
  - name: orders
    # Reads the seeded CSV directly: DuckDB is the development-tier dialect, so the
    # skeleton builds and tests with no warehouse credentials (06-dialect-strategy.md).
    sql: SELECT * FROM read_csv_auto('/cube/conf/seed/orders.csv', header = true)
    # FR-SEM-02 / T-102: cubes are private. Dashboards reference views only.
    public: false
    measures:
      - name: revenue
        type: sum
        sql: amount
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Gross order amount before returns and discounts.
            certification: certified
            last_reviewed: '2026-08-12'
      - name: order_count
        type: count
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Number of order lines.
            certification: certified
            last_reviewed: '2026-08-12'
    dimensions:
      - name: order_id
        sql: order_id
        type: number
        primary_key: true
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Order line identifier.
            certification: certified
      - name: order_date
        sql: order_date
        type: time
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Date the order was placed.
            certification: certified
      - name: region
        sql: region
        type: string
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Sales region.
            certification: certified
      - name: category
        sql: category
        type: string
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Product category.
            certification: certified
    meta:
      tailwind:
        spec_version: 1
        owner: data-team
        description: One row per order line, seeded for the M0 walking skeleton.
        certification: certified
        last_reviewed: '2026-08-12'
