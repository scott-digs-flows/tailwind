cubes:
  - name: orders_hdr
    sql: SELECT * FROM read_csv_auto('/cube/conf/seed/orders_hdr.csv', header = true)
    public: false
    joins:
      # THE FAN-OUT: one order, many lines. freight is a HEADER amount, so summing it
      # across joined lines multiplies it by the line count. Declaring this cardinality
      # is what lets Cube detect the trap -- get the direction wrong and it silently
      # does not fire.
      - name: order_lines
        relationship: one_to_many
        sql: '{CUBE}.order_id = {order_lines}.order_id'
      - name: customers
        relationship: many_to_one
        sql: '{CUBE}.customer_id = {customers}.customer_id'
    measures:
      - name: freight
        type: sum
        sql: freight
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Shipping cost, charged once per order.
            certification: certified
      - name: order_count
        type: count
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Number of orders.
            certification: certified
    dimensions:
      - name: order_id
        sql: order_id
        type: number
        primary_key: true
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Order identifier.
            certification: certified
      - name: order_date
        sql: order_date
        type: time
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Date the order was placed.
            certification: certified
    meta:
      tailwind:
        spec_version: 1
        owner: data-team
        description: Order headers. One row per order.
        certification: certified
