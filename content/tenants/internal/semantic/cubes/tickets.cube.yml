cubes:
  - name: tickets
    sql: SELECT * FROM read_csv_auto('/cube/conf/seed/tickets.csv', header = true)
    public: false
    joins:
      # THE CHASM: customers fans out to orders AND to tickets independently. Query a
      # measure from each by customer and a naive join multiplies both.
      - name: customers
        relationship: many_to_one
        sql: '{CUBE}.customer_id = {customers}.customer_id'
    measures:
      - name: ticket_hours
        type: sum
        sql: hours
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Support hours logged.
            certification: certified
    dimensions:
      - name: ticket_id
        sql: ticket_id
        type: number
        primary_key: true
        meta:
          tailwind:
            spec_version: 1
            owner: data-team
            description: Ticket identifier.
            certification: certified
    meta:
      tailwind:
        spec_version: 1
        owner: data-team
        description: Support tickets. One row per ticket.
        certification: certified
