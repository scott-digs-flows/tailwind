views:
  - name: sales
    title: Sales
    description: The certified surface dashboards may reference.
    cubes:
      # Join paths are declared from the fact outward, so the view spans the whole
      # topology: lines -> order header -> customer, and tickets -> customer.
      - join_path: order_lines
        includes:
          - revenue
          - line_count
          - category
      - join_path: order_lines.orders_hdr
        includes:
          - freight
          - order_count
          - order_date
      # Root-level, NOT nested behind order_lines: a multi-fact query (freight and
      # ticket_hours together) needs every fact to reach the shared dimension directly.
      # Nested here, Cube cannot find one join tree spanning both facts.
      - join_path: customers
        includes:
          - customer_count
          - region
          - segment
      - join_path: tickets
        includes:
          - ticket_hours
    access_policy:
      - group: analyst
        row_level:
          filters:
            []
        member_level:
          includes: '*'
      - group: west_only
        row_level:
          filters:
            - member: sales.region
              operator: equals
              values:
                - West
        member_level:
          includes: '*'
    meta:
      tailwind:
        spec_version: 1
        owner: data-team
        description: Certified sales surface for dashboards.
        certification: certified
        last_reviewed: '2026-08-12'
