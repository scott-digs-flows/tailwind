views:
  - name: sales
    title: Sales
    description: The certified surface dashboards may reference.
    cubes:
      - join_path: orders
        includes: '*'
    # ADR-003 D4. Default-deny is OURS to enforce, and Cube is stricter than expected:
    # matching a policy does NOT grant member visibility, so member_level must be
    # explicit too. There is no catch-all entry on purpose -- a context whose groups
    # match nothing sees nothing.
    access_policy:
      - group: analyst
        row_level:
          filters:
            []
        member_level:
          includes: '*'
      - group: west_only
        row_level:
          filters:
            - member: sales.region
              operator: equals
              values:
                - West
        member_level:
          includes: '*'
    meta:
      tailwind:
        spec_version: 1
        owner: data-team
        description: Certified sales surface for dashboards.
        certification: certified
        last_reviewed: '2026-08-12'
