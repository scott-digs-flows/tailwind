spec_version: 1
name: sales_overview
title: Sales Overview
freshness:
  class: standard
meta:
  tailwind:
    spec_version: 1
    owner: data-team
    description: The M0 walking-skeleton dashboard. Every number comes from the sales view.
    certification: certified
    last_reviewed: '2026-08-12'
charts:
  - id: total_revenue
    title: Total revenue
    type: kpi
    layout:
      x: 0
      y: 0
      w: 3
      h: 2
    query:
      view: sales
      metrics:
        - sales.revenue

  - id: order_count
    title: Orders
    type: kpi
    layout:
      x: 3
      y: 0
      w: 3
      h: 2
    query:
      view: sales
      metrics:
        - sales.order_count

  - id: revenue_trend
    title: Revenue by month
    type: line
    layout:
      x: 0
      y: 2
      w: 12
      h: 5
    query:
      view: sales
      metrics:
        - sales.revenue
      order:
        - member: sales.order_date
          dir: asc
      time_dimensions:
        - member: sales.order_date
          granularity: month

  - id: revenue_by_category
    title: Revenue by category
    type: bar
    layout:
      x: 0
      y: 7
      w: 6
      h: 5
    query:
      view: sales
      metrics:
        - sales.revenue
      dimensions:
        - sales.category
      order:
        - member: sales.revenue
          dir: desc

  - id: region_table
    title: Revenue and orders by region
    type: table
    layout:
      x: 6
      y: 7
      w: 6
      h: 5
    query:
      view: sales
      metrics:
        - sales.revenue
        - sales.order_count
      dimensions:
        - sales.region
      order:
        - member: sales.revenue
          dir: desc
