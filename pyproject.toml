[project]
name = "tailwind"
version = "0.1.0"
description = "Production-grade data analytics and visualization web app built with Plotly Dash, with first-class AI features for end users."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Analytics Team" }]

dependencies = [
    "dash>=3.0",
    "dash-mantine-components>=0.14",
    "dash-iconify>=0.1.2",
    "plotly>=5.22",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]
bigquery = ["google-cloud-bigquery>=3.25", "google-cloud-bigquery-storage>=2.25"]
postgres = ["psycopg[binary]>=3.2"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests>=2.32",
]

[project.scripts]
tailwind = "tailwind.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailwind"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "TID",           # tidy imports
    "D",             # pydocstyle
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dash.*", "dash_mantine_components.*", "dash_iconify.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tailwind",
    "--cov-report=term-missing",
]
markers = [
    "integration: integration tests that require external services",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["src/tailwind"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
