server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same single-origin story the Vite dev proxy gives us, so there is no CORS layer
  # in either environment.
  location /api/ {
    # nginx resolves an upstream hostname ONCE at startup when proxy_pass is a literal.
    # Restart the api container, it gets a new IP, and nginx proxies to the dead one --
    # a 502 that persists until nginx itself is restarted. Using a variable forces
    # per-request resolution through Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:3001;

    # A variable proxy_pass does not strip the location prefix, so do it explicitly.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
