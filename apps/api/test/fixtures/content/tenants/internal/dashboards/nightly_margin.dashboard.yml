# Fixture for apps/api/test/queries.test.ts. Not published content: it lives under a
# test-only TAILWIND_CONTENT_ROOT so `tailwind validate content` and CODEOWNERS routing
# are unaffected.
#
# It declares `batch` rather than `standard` on purpose. `standard` is also the value a
# request with no artifact gets, so a test written against a `standard` dashboard would
# pass just as happily if the artifact were never read at all.
#
# It does NOT declare `operational`, which is the other class a test here might reach
# for. Since TW-180 the `operational-not-in-poc` rule in `lintBundle` refuses that class
# in reviewed content until FR-FRESH-04's approval flow exists (TW-128). Note what would
# and would not catch it HERE: this file is read through `parseSpec`, which by ADR-004 D4
# still accepts the class, and the bundle lint never runs over a test-only content root.
# So an `operational` fixture would run at ttl 0 and nothing would say so -- which is
# exactly the shape of the hole TW-180 closed for real content, and the reason not to
# open a private one.
spec_version: 1
name: nightly_margin
title: Nightly margin
freshness:
  class: batch
meta:
  tailwind:
    spec_version: 1
    owner: data-team
    description: Fixture dashboard for the freshness-resolution tests.
    certification: certified
    last_reviewed: '2026-09-15'
charts:
  - id: margin_by_month
    title: Margin by month
    type: line
    layout:
      x: 0
      y: 0
      w: 6
      h: 4
    query:
      view: sales
      metrics:
        - sales.margin
      time_dimensions:
        - member: sales.order_date
          granularity: month
